  <div class="form-wrapper">
    <div class="form-container">
      <img class="logo" src="assets/Logo1.png" alt="Logo" />
      <div class="logo-text">
        <span class="emp-title-green">EMPLOYEE</span><br />
        <span class="emp-title-dark">PAYROLL</span>
      </div>

      <h2>Employee Payroll Form</h2>

      
      <form (ngSubmit)="onSubmit()" #employeeForm="ngForm">
        <mat-form-field appearance="outline" class="full-width">
          <input matInput placeholder="Name*" [(ngModel)]="employee.name" name="name" required />
        </mat-form-field>

        <label class="section-label">Profile Image</label>
        <mat-radio-group class="profile-options" [(ngModel)]="employee.profileImage" name="profileImage">
          <mat-radio-button *ngFor="let img of profileImages" [value]="img">
            <img [src]="img" alt="profile" />
          </mat-radio-button>
        </mat-radio-group>

        <label class="section-label">Gender</label>
        <mat-radio-group class="gender-options" [(ngModel)]="employee.gender" name="gender">
          <mat-radio-button value="Male">Male</mat-radio-button>
          <mat-radio-button value="Female">Female</mat-radio-button>
        </mat-radio-group>

        <label class="section-label">Department</label>
        <div class="dept-options">
          <mat-checkbox *ngFor="let dept of departments" [(ngModel)]="employee.departments[dept]" [name]="dept">
            {{ dept }}
          </mat-checkbox>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Salary</mat-label>
          <mat-select [(ngModel)]="employee.salary" name="salary">
            <mat-option *ngFor="let salary of salaryOptions" [value]="salary">
              ₹{{ salary / 1000 }}k
            </mat-option>
          </mat-select>
        </mat-form-field>
        

        <label class="section-label">Start Date</label>
        <div class="date-options">
          <mat-form-field appearance="outline">
            <mat-label>Day</mat-label>
            <mat-select [(ngModel)]="employee.startDay" name="startDay">
              <mat-option *ngFor="let day of days" [value]="day">{{ day }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Month</mat-label>
            <mat-select [(ngModel)]="employee.startMonth" name="startMonth">
              <mat-option *ngFor="let month of months" [value]="month">{{ month }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Year</mat-label>
            <mat-select [(ngModel)]="employee.startYear" name="startYear">
              <mat-option *ngFor="let year of years" [value]="year">{{ year }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <textarea matInput placeholder="Notes" [(ngModel)]="employee.notes" name="notes"></textarea>
        </mat-form-field>

      
        <div class="form-actions-container">
          <div class="cancel-button">
            <button mat-stroked-button color="warn" type="button" (click)="onCancel()">Cancel</button>
          </div>

          <div class="submit-reset-group">
            <button mat-raised-button color="primary" type="submit">Submit</button>
            <button mat-stroked-butt  on type="button" (click)="onReset()">Reset</button>
          </div>
        </div>
      </form>
    </div>
  </div>
